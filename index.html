<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#111617" />
    <title>Nicolas Cerrato Anton | Frontier Software Studio</title>


    <meta property="og:title" content="Nicolas Cerrato Anton | Frontier Software Studio" />
    <meta property="og:description" content="My corner of the internet" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Linked here rather than @import-ed from index.css: an @import cannot
         begin downloading until the stylesheet that contains it has arrived,
         which serialises fonts behind the CSS request. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Silkscreen&display=swap"
    >
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' shape-rendering='crispEdges'%3E%3Crect width='32' height='32' fill='%23111617'/%3E%3Cpath fill='%23bcc77c' d='M7 8h3v16H7zM22 8h3v16h-3zM10 9h3v5h-3zM13 13h3v5h-3zM16 17h3v5h-3zM19 20h3v3h-3z'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved accent before first paint (storage may be blocked).
      try {
        var a = localStorage.getItem("nca-accent-v2") ||
          ["lichen", "torch", "astral", "madder", "mono", "manuscript"][parseInt(localStorage.getItem("nca-accent"), 10)];
        if (a && a !== "lichen") document.documentElement.setAttribute("data-accent", a);
      } catch (e) {}

      // Hold the hero name reveal until Literata is in: with display=swap the
      // fallback serif paints first, sits higher, and jumps mid-reveal. The
      // timeout keeps a slow font from hiding the name.
      (function () {
        var root = document.documentElement;
        if (!document.fonts || !document.fonts.load) return;
        root.classList.add("fonts-pending");
        var done = function () { root.classList.remove("fonts-pending"); };
        Promise.race([
          document.fonts.load('400 1em "Literata"'),
          new Promise(function (r) { setTimeout(r, 1500); })
        ]).then(done, done);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
